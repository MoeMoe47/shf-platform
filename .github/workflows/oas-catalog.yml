name: OAS canonical catalog
on:
  push:
    paths: ['standards/oas/**', 'schemas/oas/**', 'scripts/oas-catalog.mjs', 'scripts/oas-first-release.mjs', 'scripts/oas-governance-review.mjs', 'scripts/oas-scope-closure.mjs', 'scripts/oas-rc1-acceptance.mjs', 'scripts/oas-final-publication.mjs', 'scripts/verify-oas-final-publication.py', 'evidence/oas-rc1-issuance/**', 'evidence/oas-governance-resolution/**', 'evidence/oas-governance-review/**', 'docs/OAS*', 'evidence/oas-first-release/review-package/**', 'tests/oas*', 'src/pages/oas/**', 'public/oas/**', 'vite.oas.config.mjs', 'package.json', 'package-lock.json', '.github/workflows/oas-catalog.yml']
  pull_request:
    paths: ['standards/oas/**', 'schemas/oas/**', 'scripts/oas-catalog.mjs', 'scripts/oas-first-release.mjs', 'scripts/oas-governance-review.mjs', 'scripts/oas-scope-closure.mjs', 'scripts/oas-rc1-acceptance.mjs', 'scripts/oas-final-publication.mjs', 'scripts/verify-oas-final-publication.py', 'evidence/oas-rc1-issuance/**', 'evidence/oas-governance-resolution/**', 'evidence/oas-governance-review/**', 'docs/OAS*', 'evidence/oas-first-release/review-package/**', 'tests/oas*', 'src/pages/oas/**', 'public/oas/**', 'vite.oas.config.mjs', 'package.json', 'package-lock.json', '.github/workflows/oas-catalog.yml']
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Earlier suites assert that no final artifact exists. Run their unchanged
      # assertions at the immutable adoption checkpoint, never hide public files.
      - name: Prepare immutable pre-publication checkpoint
        run: |
          git worktree add --detach "$RUNNER_TEMP/oas-adoption-checkpoint" 164798c8a684e4c3605fc89492918ca00552e70b
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/oas-adoption-checkpoint/node_modules"
      - run: npm run oas:check
      - run: npm run oas:test
      - run: npm run oas:first:check
      - run: npm run oas:first:test
      - run: npm run oas:governance:check
      - run: npm run oas:governance:test
        working-directory: ${{ runner.temp }}/oas-adoption-checkpoint
      - run: npm run oas:closure:check
      - run: npm run oas:closure:test
        working-directory: ${{ runner.temp }}/oas-adoption-checkpoint
      - run: npm run oas:rc1:acceptance:check
      - run: npm run oas:rc1:test
        working-directory: ${{ runner.temp }}/oas-adoption-checkpoint
      - run: npm run oas:typecheck
      - run: npm run oas:first:typecheck
      - run: npm run oas:governance:typecheck
      - run: npm run oas:closure:typecheck
      - run: npm run oas:rc1:typecheck
      - run: npm run oas:final:test
        working-directory: ${{ runner.temp }}/oas-adoption-checkpoint
      - run: node --test tests/oasFinalAdoption.test.mjs
        working-directory: ${{ runner.temp }}/oas-adoption-checkpoint
      - run: node scripts/oas-final-adoption.mjs verify
        working-directory: ${{ runner.temp }}/oas-adoption-checkpoint
      - run: python3 scripts/verify-oas-final-adoption.py
        working-directory: ${{ runner.temp }}/oas-adoption-checkpoint
      - run: npm run oas:publication:check
      - run: npm run oas:publication:test
      - run: npm run oas:publication:typecheck
      - run: npm run oas:publication:verify
      - run: npm run oas:build
      - run: git diff --check
