name: OAS canonical catalog
on:
  push:
    paths: ['standards/oas/**', 'schemas/oas/**', 'scripts/oas-catalog.mjs', 'tests/oas*', 'src/pages/oas/**', 'public/oas/**', 'vite.oas.config.mjs', 'package.json', 'package-lock.json', '.github/workflows/oas-catalog.yml']
  pull_request:
    paths: ['standards/oas/**', 'schemas/oas/**', 'scripts/oas-catalog.mjs', 'tests/oas*', 'src/pages/oas/**', 'public/oas/**', 'vite.oas.config.mjs', 'package.json', 'package-lock.json', '.github/workflows/oas-catalog.yml']
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run oas:check
      - run: npm run oas:test
      - run: npm run oas:typecheck
      - run: npm run oas:build
      - run: git diff --check
