name: OAS canonical catalog
on:
  push:
    paths: ['standards/oas/**', 'schemas/oas/**', 'scripts/oas-catalog.mjs', 'scripts/oas-first-release.mjs', 'scripts/oas-governance-review.mjs', 'scripts/oas-scope-closure.mjs', 'scripts/oas-rc1-acceptance.mjs', 'evidence/oas-rc1-issuance/**', 'evidence/oas-governance-resolution/**', 'evidence/oas-governance-review/**', 'docs/OAS*', 'evidence/oas-first-release/review-package/**', 'tests/oas*', 'src/pages/oas/**', 'public/oas/**', 'vite.oas.config.mjs', 'package.json', 'package-lock.json', '.github/workflows/oas-catalog.yml']
  pull_request:
    paths: ['standards/oas/**', 'schemas/oas/**', 'scripts/oas-catalog.mjs', 'scripts/oas-first-release.mjs', 'scripts/oas-governance-review.mjs', 'scripts/oas-scope-closure.mjs', 'scripts/oas-rc1-acceptance.mjs', 'evidence/oas-rc1-issuance/**', 'evidence/oas-governance-resolution/**', 'evidence/oas-governance-review/**', 'docs/OAS*', 'evidence/oas-first-release/review-package/**', 'tests/oas*', 'src/pages/oas/**', 'public/oas/**', 'vite.oas.config.mjs', 'package.json', 'package-lock.json', '.github/workflows/oas-catalog.yml']
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run oas:check
      - run: npm run oas:test
      - run: npm run oas:first:check
      - run: npm run oas:first:test
      - run: npm run oas:governance:check
      - run: npm run oas:governance:test
      - run: npm run oas:closure:check
      - run: npm run oas:closure:test
      - run: npm run oas:rc1:acceptance:check
      - run: npm run oas:rc1:test
      - run: npm run oas:typecheck
      - run: npm run oas:first:typecheck
      - run: npm run oas:governance:typecheck
      - run: npm run oas:closure:typecheck
      - run: npm run oas:rc1:typecheck
      - run: npm run oas:build
      - run: git diff --check
