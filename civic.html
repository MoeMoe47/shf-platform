<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Civic — Silicon Heartland</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Applies the saved/system theme before first paint, matching the
      // resolution logic in src/utils/civicTheme.js, so switching to Dark
      // doesn't flash light on load/refresh (module scripts — including
      // civic.main.jsx's own early init call — only run once the full
      // unbundled dev-mode import graph has resolved, which is too late to
      // beat first paint). Kept in sync manually with that module since it
      // must run synchronously, before any bundle — mirrors career.html's
      // identical pattern for careerTheme.js.
      (function () {
        try {
          var pref = localStorage.getItem("civic:theme");
          if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
          var resolved =
            pref === "system"
              ? (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
              : pref;
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root" data-app="civic"></div>
    <script type="module" src="/src/entries/civic.main.jsx"></script>
  </body>
</html>
