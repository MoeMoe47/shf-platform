name: Funding Integrity Gate

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  funding-integrity:
    name: Outcome Engine Integrity Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/shf-agent-fabric

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Start funding service
        env:
          PYTHONPATH: .
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8001 > /tmp/funding_ci.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8001/api/funding/health >/dev/null && break
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8001/api/funding/health | python -m json.tool

      - name: Run Integrity Gate tests only
        env:
          PYTHONPATH: .
          FUNDING_BASE_URL: http://127.0.0.1:8001
        run: |
          pytest -q tests/test_funding_integrity_gate.py
