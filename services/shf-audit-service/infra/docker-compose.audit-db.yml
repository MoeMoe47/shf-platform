services:
  audit_db:
    image: postgres:16
    container_name: shf_audit_db
    environment:
      POSTGRES_DB: shf_audit_db
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - shf_audit_db_data:/var/lib/postgresql/data
volumes:
  shf_audit_db_data:
